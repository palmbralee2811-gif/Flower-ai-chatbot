<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- Line art tulip flower icon from Bloomy Design Spec -->
  <g fill="none" stroke="#6F7453" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" transform="translate(15, 10) scale(0.7)">
    <!-- Leaves -->
    <path d="M 50,85 C 32,85 10,70 12,42 C 24,52 38,68 50,85 Z" />
    <path d="M 50,85 C 68,85 90,70 88,42 C 76,52 62,68 50,85 Z" />
    <!-- Stem -->
    <line x1="50" y1="52" x2="50" y2="95" stroke-width="3.5" />
    <!-- Tulip petals outline -->
    <!-- Center petal -->
    <path d="M 50,15 C 40,25 40,42 50,56 C 60,42 60,25 50,15 Z" />
    <!-- Left petal -->
    <path d="M 46,20 C 30,22 25,38 42,54" />
    <!-- Right petal -->
    <path d="M 54,20 C 70,22 75,38 58,54" />
  </g>
</svg>
